# JWT Secret (weak secret OK for local dev)
jwt.secret=your-256-bit-secret-key-here-make-it-at-least-32-bytes-long

# Local Database
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=changemeinprod!

# Local Redis (no SSL)
spring.data.redis.url=redis://localhost:6379
spring.data.redis.ssl.enabled=false

# Email (you can use a test account or mailtrap.io)
spring.mail.username=your-local-test@example.com
spring.mail.password=local-password
app.mail.from=dev@localhost

# Debug settings for local
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.data.redis=DEBUG
spring.mail.properties.mail.debug=true